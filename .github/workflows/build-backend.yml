name: Build backend

on:
  push:
    tags:
      - 'api-*'

jobs:

  build:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Run build with maven
        run: mvn clean package -f samlingar_back/samlingar-service

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/samlingar-api
          tags: |
            type=match,pattern=^api-(.*)$,group=1

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: samlingar_back/samlingar-service/samlingar-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

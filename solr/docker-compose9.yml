services:
  solr:
    image: solr:9.11
    container_name: solr
    restart: always
    environment:
      SOLR_JAVA_MEM: -Xms2g -Xmx2g
      SOLR_OPTS: -XX:-UseLargePages
    ports:
      - 18983:8983
    volumes:
      - ./log4j2.xml:/var/solr/log4j2.xml
      - ./solr9:/var/solr/data
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - samlingar

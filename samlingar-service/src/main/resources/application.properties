samlingar.solr.base-url=http://localhost:18983/solr
samlingar.solr.collection=samlingar
# If you want to use basic authentication, create a .env file in the root of the project 
# and set the samlingar.solr.username and samlingar.solr.password properties.
samlingar.solr.username=not-used
samlingar.solr.password=not-used

quarkus.http.root-path=/api
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=Origin, X-Requested-With, Content-Type, Accept
quarkus.http.cors.return-exact-origins=false

quarkus.smallrye-openapi.info-title=NRM Samlingar API

quarkus.swagger-ui.title=NRM Samlingar API
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.always-include=true
